name: Android app

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Engine tests
        run: npm test

      - name: Copy web files into the app
        run: npm run android:sync

      - name: Restore signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.MUNVARI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/munvari.keystore"
            echo "MUNVARI_KEYSTORE_PATH=$RUNNER_TEMP/munvari.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build test APK and Play Store bundle
        working-directory: android
        env:
          MUNVARI_KEYSTORE_PASSWORD: ${{ secrets.MUNVARI_KEYSTORE_PASSWORD }}
          MUNVARI_KEY_ALIAS: ${{ secrets.MUNVARI_KEY_ALIAS }}
          MUNVARI_KEY_PASSWORD: ${{ secrets.MUNVARI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PversionCode=${{ github.run_number }} assembleDebug bundleRelease

      - name: Upload test APK (install directly on a phone)
        uses: actions/upload-artifact@v4
        with:
          name: munvari-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: munvari-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
